server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 15m;
 location /api/ { proxy_pass http://backend:3101; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_connect_timeout 10s; proxy_read_timeout 35s; }
 location / { try_files $uri $uri/ /index.html; }
 location = /index.html { add_header Cache-Control "no-cache"; }
}
