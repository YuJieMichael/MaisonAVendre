name: PR merge count

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  count:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Count confirmed PR merges into main
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'closed', base: 'main', per_page: 100
            });
            const merges = pulls.filter(pr => pr.merged_at)
              .sort((a, b) => a.merged_at.localeCompare(b.merged_at) || a.number - b.number)
              .map(pr => ({ number: pr.number, url: pr.html_url, mergedAt: pr.merged_at, commit: pr.merge_commit_sha }));
            const report = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              base: 'main', generatedAt: new Date().toISOString(),
              mergedCount: merges.length, merges
            };
            require('node:fs').writeFileSync('merge-history.json', JSON.stringify(report, null, 2) + '\n');
            await core.summary
              .addHeading('PR merge count / Nombre de PR fusionnées / PR 合并次数')
              .addRaw(`Total / Total / 累计: ${merges.length}\n\n`)
              .addRaw('Only PRs merged into main are counted. Direct pushes and unmerged closures are excluded.\n\n')
              .addRaw('Seules les PR fusionnées dans main sont comptées. Les push directs et les fermetures sans fusion sont exclus.\n\n')
              .addRaw('只统计已合并到 main 的 PR，直接 push 和未合并关闭均不计入。\n\n')
              .addTable([
                [{data: 'PR', header: true}, {data: 'Merged / Fusion / 合并时间 (UTC)', header: true}],
                ...merges.slice(-20).reverse().map(pr => [`#${pr.number}`, pr.mergedAt])
              ])
              .write();
      - name: Save merge history / Enregistrer l’historique / 保存合并记录
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: merge-history-${{ github.run_number }}
          path: merge-history.json
          if-no-files-found: error
          retention-days: 90
